name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test SshTailscaleManager.sln -c Release

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/SshTailscaleManager/SshTailscaleManager.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish

      - name: Sign exe (only if a code-signing certificate secret is set)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host 'No CODESIGN_PFX_BASE64 secret; exe left unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish/SshTailscaleManager.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $signtool verify /pa publish/SshTailscaleManager.exe
          Remove-Item $pfx -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' publish/SshTailscaleManager.exe `
            --repo '${{ github.repository }}' `
            --title '${{ github.ref_name }}' `
            --generate-notes

  deb:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb openssh-client

      - name: Run Linux tests
        working-directory: linux
        run: python3 -m unittest discover -s tests -v

      - name: Build .deb
        run: |
          version='${{ github.ref_name }}'
          version="${version#v}"
          bash linux/packaging/build-deb.sh "$version" dist

      - name: Verify .deb and GUI start
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a python3 -c "import sys; sys.path.insert(0,'/usr/lib/ssh-tailscale-manager'); from sshtsm.app import App; a=App(); a.update_idletasks(); a.after(1000,a.destroy); a.mainloop(); print('GUI ok')"

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' dist/*.deb --repo '${{ github.repository }}' --clobber
